# End-to-end suite on an iOS Simulator (see TESTING.md). Manual only: it
# never runs on push, so it cannot start a TestFlight build, and it needs no
# signing. It talks only to a local backend and the Firebase Auth emulator.
#
# Needs secret BACKEND_REPO_TOKEN: a read-only token for the backend repo.
name: e2e

on:
  workflow_dispatch:
    inputs:
      backend_ref:
        description: bojang-backend branch to test against
        default: main
      tests:
        description: test files (space-separated); empty = the whole suite
        default: ""

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ${{ vars.IOS_RUNNER || 'macos-26' }}
    timeout-minutes: 120
    env:
      FLUTTER_VERSION: 3.35.1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ProjectMira/bojang-backend
          ref: ${{ inputs.backend_ref }}
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          path: bojang-backend
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/setup-python@v5 # pin to a SHA like the other actions before relying on it
        with:
          python-version: "3.12"
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Backend and emulator dependencies
        run: |
          python -m venv bojang-backend/functions/venv
          bojang-backend/functions/venv/bin/pip install -q -r bojang-backend/functions/requirements.txt pytest
          npm install -g firebase-tools
      - run: flutter pub get
      - name: Run the suite
        env:
          BOJANG_BACKEND_PY: ${{ github.workspace }}/bojang-backend/functions/venv/bin/python
        run: ci/scripts/e2e.sh --backend bojang-backend --out build/e2e ${{ inputs.tests }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-results
          path: build/e2e
          retention-days: 14
