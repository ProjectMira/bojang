# Mobile Release
#
# This GitHub Actions workflow is the sole automated TestFlight/Google Play
# release pipeline. Keep the legacy Xcode Cloud workflow disabled: it also
# reacts to the bot's version-bump commit, does not honor [skip ci], and starts
# from a clean checkout without Flutter/CocoaPods generated files.
# See docs/mobile-release.md#release-pipeline-ownership.
#
# Every push to main releases: the marketing version is bumped from the
# commits since the last release tag (feat: -> minor, "!" or a BREAKING
# CHANGE footer -> major, anything else -> patch — see
# ci/scripts/bump_version.sh), committed back with [skip ci], and the build
# number comes from the run counter, so it is always higher than the last one
# without reading anything back out of git.
name: Mobile Release

"on":
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_bump:
        description: Marketing version part to bump; "auto" derives it from the commit messages
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
          - build-only
      version:
        description: Optional exact marketing version, for example 1.2.3
        required: false
        type: string
      release_android:
        description: Build and upload Android
        required: true
        default: true
        type: boolean
      release_ios:
        description: Build and upload iOS
        required: true
        default: true
        type: boolean
      android_track:
        description: Google Play track
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      enable_ios_firebase:
        description: Enable Firebase on iOS; requires GOOGLE_SERVICE_INFO_PLIST. Google sign-in and backend account sync need this.
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep this aligned with the project's dependency lockfile. google_fonts 6.x
  # does not compile with Flutter 3.44's non-primitive FontWeight equality.
  FLUTTER_VERSION: 3.35.1

jobs:
  prepare:
    name: Prepare version
    if: ${{ github.event_name != 'push' || vars.AUTO_MOBILE_RELEASE_PAUSED != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The release token lives in this environment, and this job now pushes the
    # version bump.
    environment: mobile-production
    permissions:
      contents: write
    outputs:
      marketing: ${{ steps.version.outputs.marketing }}
      build: ${{ steps.version.outputs.build }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_sha: ${{ steps.version.outputs.release_sha }}
      release_android: ${{ steps.config.outputs.release_android }}
      release_ios: ${{ steps.config.outputs.release_ios }}
      android_track: ${{ steps.config.outputs.android_track }}
      enable_ios_firebase: ${{ steps.config.outputs.enable_ios_firebase }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The branch head, not the triggering commit: a queued run must see
          # the version the run ahead of it just committed.
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}

      - name: Resolve release settings
        id: config
        env:
          INPUT_VERSION_BUMP: ${{ inputs.version_bump }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_RELEASE_ANDROID: ${{ inputs.release_android }}
          INPUT_RELEASE_IOS: ${{ inputs.release_ios }}
          INPUT_ANDROID_TRACK: ${{ inputs.android_track }}
          INPUT_ENABLE_IOS_FIREBASE: ${{ inputs.enable_ios_firebase }}
          ANDROID_RELEASE_PAUSED: ${{ vars.ANDROID_RELEASE_PAUSED }}
        run: |
          set -euo pipefail
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Mobile releases must be started from main."
            exit 1
          fi

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # Empty: the bump level is derived from the commits themselves.
            version_bump=""
            requested_version=""
            release_android="true"
            if [ "${ANDROID_RELEASE_PAUSED:-}" = "true" ]; then
              echo "::notice::Android is paused via the ANDROID_RELEASE_PAUSED repository variable; releasing iOS only."
              release_android="false"
            fi
            release_ios="true"
            android_track="internal"
            # Firebase must stay enabled on iOS: Google sign-in and backend
            # account sync both run through it.
            enable_ios_firebase="true"
          else
            # "auto" means: let bump_version.sh read the commits.
            version_bump="$INPUT_VERSION_BUMP"
            if [ "$version_bump" = "auto" ]; then version_bump=""; fi
            requested_version="$INPUT_VERSION"
            release_android="$INPUT_RELEASE_ANDROID"
            release_ios="$INPUT_RELEASE_IOS"
            android_track="$INPUT_ANDROID_TRACK"
            enable_ios_firebase="$INPUT_ENABLE_IOS_FIREBASE"
          fi

          if [ "$release_android" != "true" ] && [ "$release_ios" != "true" ]; then
            echo "::error::Select at least one release platform."
            exit 1
          fi

          echo "version_bump=$version_bump" >> "$GITHUB_OUTPUT"
          echo "requested_version=$requested_version" >> "$GITHUB_OUTPUT"
          echo "release_android=$release_android" >> "$GITHUB_OUTPUT"
          echo "release_ios=$release_ios" >> "$GITHUB_OUTPUT"
          echo "android_track=$android_track" >> "$GITHUB_OUTPUT"
          echo "enable_ios_firebase=$enable_ios_firebase" >> "$GITHUB_OUTPUT"

      - name: Verify the release token can push
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::RELEASE_GITHUB_TOKEN is empty. It lives in the mobile-production environment; this job must declare that environment and the secret must be set."
            exit 1
          fi
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/user)"
          if [ "$status" != "200" ]; then
            echo "::error::RELEASE_GITHUB_TOKEN was rejected by GitHub (HTTP $status) — it has most likely expired. Regenerate the PAT and update the mobile-production environment secret."
            exit 1
          fi

      # The marketing version advances on every release, not just the build
      # number: ci/scripts/bump_version.sh reads the commits since the last
      # release tag (feat: -> minor, "!"/BREAKING CHANGE -> major, anything
      # else -> patch) and rewrites pubspec.yaml. The bump is committed here,
      # BEFORE the builds run, so a release can no longer ship to a store and
      # then fail to record its version.
      - name: Calculate and commit release version
        id: version
        env:
          REQUESTED_VERSION: ${{ steps.config.outputs.requested_version }}
          VERSION_BUMP_OVERRIDE: ${{ steps.config.outputs.version_bump }}
          BUILD_NUMBER_OFFSET: ${{ vars.BUILD_NUMBER_OFFSET }}
        run: |
          set -euo pipefail

          bash ci/scripts/bump_version.sh
          marketing="$(grep -E '^version:' pubspec.yaml | head -1 \
            | sed -E 's/^version:[[:space:]]*//' | cut -d+ -f1)"

          # Build numbers come from the run counter: strictly increasing, never
          # read back from git, so a failed run cannot strand one and make the
          # next upload a duplicate. The offset keeps it above build 22, which
          # the old history-scanning scheme already consumed.
          offset="${BUILD_NUMBER_OFFSET:-0}"
          build="$(( ${{ github.run_number }} + offset ))"

          version="$marketing+$build"
          tag="v$marketing-build.$build"

          if ! git diff --quiet -- pubspec.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pubspec.yaml
            # [skip ci] keeps this push from starting another release.
            git commit -q -m "chore(release): bump version to $marketing [skip ci]"

            pushed=""
            for attempt in 1 2 3; do
              if git push origin "HEAD:${{ github.ref_name }}"; then
                pushed="yes"
                break
              fi
              echo "::warning::Version push attempt $attempt failed; rebasing onto origin/${{ github.ref_name }} and retrying."
              git fetch origin "${{ github.ref_name }}"
              git rebase "origin/${{ github.ref_name }}" || {
                echo "::error::Could not rebase the version bump onto ${{ github.ref_name }}."
                exit 1
              }
            done
            if [ -z "$pushed" ]; then
              echo "::error::Could not push the version bump to ${{ github.ref_name }} after 3 attempts."
              exit 1
            fi
          else
            echo "pubspec.yaml already carries $marketing; nothing to commit."
          fi

          echo "marketing=$marketing" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          {
            echo "### Mobile release"
            echo "- Version: \`$version\`"
            echo "- Tag: \`$tag\`"
            echo "- Trigger: \`$GITHUB_EVENT_NAME\`"
            echo "- Android: \`${{ steps.config.outputs.release_android }}\`"
            echo "- iOS: \`${{ steps.config.outputs.release_ios }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Analyze app and run model tests
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The commit carrying the bumped version, so the binary and the
          # release tag describe the same tree.
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Run stable model tests
        run: flutter test test/models

  android:
    name: Android / Google Play
    if: ${{ needs.prepare.outputs.release_android == 'true' }}
    needs:
      - prepare
      - quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: mobile-production
    env:
      ANDROID_PACKAGE_NAME: ${{ vars.ANDROID_PACKAGE_NAME || 'com.projectmira.bojang' }}
      ANDROID_UPLOAD_CERT_SHA1: ${{ vars.ANDROID_UPLOAD_CERT_SHA1 }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The commit carrying the bumped version, so the binary and the
          # release tag describe the same tree.
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Validate Android configuration
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD GOOGLE_PLAY_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing mobile-production secret: $name"
              missing=1
            fi
          done
          if [ "$ANDROID_PACKAGE_NAME" != "com.projectmira.bojang" ]; then
            echo "::error::ANDROID_PACKAGE_NAME must match Gradle applicationId com.projectmira.bojang"
            missing=1
          fi
          exit "$missing"

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore Android upload key
        run: |
          set -euo pipefail
          keystore="$GITHUB_WORKSPACE/android/app/upload-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          cat > android/key.properties << PROPERTIES
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          PROPERTIES
          keytool -list -keystore "$keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Verify keystore matches the Google Play upload key
        if: ${{ env.ANDROID_UPLOAD_CERT_SHA1 != '' }}
        run: |
          set -euo pipefail
          keystore="$GITHUB_WORKSPACE/android/app/upload-keystore.jks"
          actual="$(keytool -exportcert -rfc \
              -keystore "$keystore" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS" \
            | openssl x509 -noout -fingerprint -sha1 \
            | sed 's/^.*=//')"
          normalize() { printf '%s' "$1" | tr -d ': ' | tr '[:lower:]' '[:upper:]'; }
          if [ "$(normalize "$actual")" != "$(normalize "$ANDROID_UPLOAD_CERT_SHA1")" ]; then
            echo "::error::Keystore certificate SHA-1 $actual does not match Google Play's registered upload certificate $ANDROID_UPLOAD_CERT_SHA1. Google Play will reject the bundle. Either point ANDROID_KEYSTORE_BASE64 at the registered upload keystore, or complete a Play Console upload-key reset and update the ANDROID_UPLOAD_CERT_SHA1 repository variable. See docs/mobile-release.md."
            exit 1
          fi

      - name: Build signed Android App Bundle
        run: |
          set -euo pipefail
          flutter pub get
          flutter build appbundle \
            --release \
            --build-name "${{ needs.prepare.outputs.marketing }}" \
            --build-number "${{ needs.prepare.outputs.build }}"

      - name: Verify Android bundle signature
        run: |
          set -euo pipefail
          bundle="build/app/outputs/bundle/release/app-release.aab"
          test -s "$bundle"
          # App Bundles contain nested dependency metadata that jarsigner reports as
          # strict warnings even when the bundle signature is valid. Standard
          # verification still fails for a missing, malformed, or invalid signature.
          jarsigner -verify "$bundle"

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.ANDROID_PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: ${{ needs.prepare.outputs.android_track }}
          status: completed

      - name: Upload Android artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bojang-android-${{ needs.prepare.outputs.version }}
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: ignore
          retention-days: 14

  ios:
    name: iOS / TestFlight
    if: ${{ needs.prepare.outputs.release_ios == 'true' }}
    needs:
      - prepare
      - quality
    runs-on: macos-26
    # Two full builds (flutter, then xcodebuild archive) plus a several
    # hundred MB upload; 60 was the binding constraint on a slow runner.
    timeout-minutes: 75
    environment: mobile-production
    env:
      XCODE_VERSION: ${{ vars.XCODE_VERSION }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.bojang.app' }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID || secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_API_ISSUER_ID || secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
      GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # The commit carrying the bumped version, so the binary and the
          # release tag describe the same tree.
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Validate iOS configuration
        run: |
          set -euo pipefail
          missing=0
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing mobile-production variable or secret: $name"
              missing=1
            fi
          done
          if [ "$IOS_BUNDLE_ID" != "com.bojang.app" ]; then
            echo "::error::IOS_BUNDLE_ID must match Xcode bundle identifier com.bojang.app"
            missing=1
          fi
          if [ "${{ needs.prepare.outputs.enable_ios_firebase }}" = "true" ] && [ -z "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "::error::GOOGLE_SERVICE_INFO_PLIST is required when iOS Firebase is enabled"
            missing=1
          fi
          exit "$missing"

      - name: Select Xcode
        run: |
          set -euo pipefail
          # Opt-in pin: set the XCODE_VERSION repository variable to hold a
          # specific Xcode when the image default breaks a release. Left unset,
          # the image default is used — pinning to a version that predates the
          # Flutter toolchain is its own way to fail.
          if [ -n "${XCODE_VERSION:-}" ]; then
            preferred="/Applications/Xcode_${XCODE_VERSION}.app"
            if [ -d "$preferred" ]; then
              sudo xcode-select -s "$preferred"
            else
              echo "::warning::Xcode $XCODE_VERSION is not installed on this runner; using the image default. Available: $(ls -d /Applications/Xcode*.app 2>/dev/null | tr '\n' ' ')"
            fi
          fi
          echo "Xcode in use: $(xcodebuild -version | tr '\n' ' ')"
          echo "Available: $(ls -d /Applications/Xcode*.app 2>/dev/null | tr '\n' ' ')"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore and validate App Store Connect key
        id: asc-key
        run: |
          set -euo pipefail
          key_dir="$HOME/.appstoreconnect/private_keys"
          key_path="$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$key_dir"

          raw="$(printf '%s' "$ASC_PRIVATE_KEY" | sed -e 's/\\r//g' -e 's/\\n//g' | tr -d '\r')"
          if ! printf '%s' "$raw" | grep -q 'BEGIN PRIVATE KEY'; then
            raw="$(printf '%s' "$raw" | tr -d '[:space:]' | openssl base64 -d -A 2>/dev/null || true)"
          fi
          body="$(printf '%s' "$raw" \
            | sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' \
            | tr -d '[:space:]')"
          {
            echo '-----BEGIN PRIVATE KEY-----'
            printf '%s\n' "$body" | fold -w 64
            echo '-----END PRIVATE KEY-----'
          } > "$key_path"
          chmod 600 "$key_path"

          if ! openssl pkey -in "$key_path" -noout >/dev/null 2>&1; then
            echo "::error::APP_STORE_CONNECT_API_PRIVATE_KEY is not a valid .p8 private key"
            exit 1
          fi
          echo "path=$key_path" >> "$GITHUB_OUTPUT"

      - name: Restore Firebase iOS configuration
        if: ${{ env.GOOGLE_SERVICE_INFO_PLIST != '' }}
        run: |
          set -euo pipefail
          plist="$GOOGLE_SERVICE_INFO_PLIST"
          if ! printf '%s' "$plist" | grep -q '<plist'; then
            decoded="$(printf '%s' "$plist" | tr -d '[:space:]' | openssl base64 -d -A 2>/dev/null || true)"
            if printf '%s' "$decoded" | grep -q '<plist'; then
              plist="$decoded"
            fi
          fi
          printf '%s' "$plist" | sed -e 's/\\r//g' -e 's/\\n//g' | tr -d '\r' > ios/Runner/GoogleService-Info.plist
          plutil -lint ios/Runner/GoogleService-Info.plist
          configured_bundle="$(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' ios/Runner/GoogleService-Info.plist)"
          if [ "$configured_bundle" != "$IOS_BUNDLE_ID" ]; then
            echo "::error::Firebase plist bundle ID $configured_bundle does not match $IOS_BUNDLE_ID"
            exit 1
          fi

      - name: Configure Google Sign-In iOS client ID
        run: |
          set -euo pipefail
          gs_plist=ios/Runner/GoogleService-Info.plist
          info_plist=ios/Runner/Info.plist
          client_id="$(/usr/libexec/PlistBuddy -c 'Print :CLIENT_ID' "$gs_plist" 2>/dev/null || true)"
          reversed_id="$(/usr/libexec/PlistBuddy -c 'Print :REVERSED_CLIENT_ID' "$gs_plist" 2>/dev/null || true)"
          case "$client_id" in
            *.apps.googleusercontent.com)
              sed -i '' "s|TODO_CLIENT_ID\.apps\.googleusercontent\.com|$client_id|" "$info_plist"
              ;;
          esac
          case "$reversed_id" in
            com.googleusercontent.apps.*)
              sed -i '' "s|com\.googleusercontent\.apps\.TODO_REVERSED_CLIENT_ID|$reversed_id|" "$info_plist"
              ;;
          esac
          if grep -q 'TODO_CLIENT_ID\|TODO_REVERSED_CLIENT_ID' "$info_plist"; then
            echo "::error::Google Sign-In client ID is still a placeholder. Register an iOS OAuth client for com.bojang.app (Firebase console -> iOS app), update the GOOGLE_SERVICE_INFO_PLIST secret with its GoogleService-Info.plist, and CI will fill ios/Runner/Info.plist from it. Alternatively commit the real GIDClientID and reversed-client-ID URL scheme directly in Info.plist."
            exit 1
          fi
          plutil -lint "$info_plist"

      - name: Verify App Store Connect credentials
        env:
          ASC_KEY_PATH: ${{ steps.asc-key.outputs.path }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/asc_jwt.rb" <<'RUBY'
          require 'openssl'
          require 'base64'
          require 'json'

          key_id, issuer, key_path = ARGV
          key = OpenSSL::PKey.read(File.read(key_path))
          encode = ->(value) { Base64.urlsafe_encode64(value).delete('=') }
          header = encode.call({ alg: 'ES256', kid: key_id, typ: 'JWT' }.to_json)
          now = Time.now.to_i
          payload = encode.call({ iss: issuer, iat: now, exp: now + 600, aud: 'appstoreconnect-v1' }.to_json)
          input = "#{header}.#{payload}"
          signature = OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new, input))
          r, s = signature.value.map { |value| value.value.to_s(2).rjust(32, "\x00") }
          puts "#{input}.#{encode.call(r + s)}"
          RUBY

          token="$(ruby "$RUNNER_TEMP/asc_jwt.rb" "$ASC_KEY_ID" "$ASC_ISSUER_ID" "$ASC_KEY_PATH")"
          status="$(curl -sS --retry 3 --retry-all-errors -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            'https://api.appstoreconnect.apple.com/v1/apps?limit=1')"
          if [ "$status" != "200" ]; then
            echo "::error::App Store Connect rejected the key ID, issuer ID, or private key (HTTP $status)"
            exit 1
          fi

      - name: Install dependencies
        run: |
          set -euo pipefail
          flutter pub get
          cd ios
          # The CocoaPods CDN is a routine source of one-off failures.
          pod install || pod install --repo-update

      - name: Prepare unsigned Flutter iOS build
        run: |
          set -euo pipefail
          mkdir -p build/ios
          # Job logs need repo admin to read, so surface the failure itself as
          # an annotation, which is public.
          if ! flutter build ios \
            --release \
            --no-codesign \
            --build-name "${{ needs.prepare.outputs.marketing }}" \
            --build-number "${{ needs.prepare.outputs.build }}" \
            --dart-define "ENABLE_IOS_FIREBASE=${{ needs.prepare.outputs.enable_ios_firebase }}" \
            2>&1 | tee build/ios/flutter-build.log; then
            echo "::error::flutter build ios failed: $(tail -n 30 build/ios/flutter-build.log | tr '\n' ' ' | tail -c 900)"
            exit 1
          fi

      - name: Archive iOS app without code signing
        # Fresh runners have empty keychains, so signing during archive makes
        # Xcode mint a new Apple Development certificate every run until the
        # account hits its certificate limit. Archive unsigned; the export
        # step signs with the cloud-managed Apple Distribution certificate.
        run: |
          set -euo pipefail
          mkdir -p build/ios/archive
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/archive/Runner.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            FLUTTER_BUILD_NAME="${{ needs.prepare.outputs.marketing }}" \
            FLUTTER_BUILD_NUMBER="${{ needs.prepare.outputs.build }}" \
            2>&1 | tee build/ios/xcodebuild-archive.log

      - name: Embed entitlements via ad-hoc signature
        # The archive is built unsigned, and exportArchive derives the
        # entitlements to re-sign with from the app's existing signature.
        # Ad-hoc signing the archived app with Runner.entitlements gives the
        # export step a signature to preserve; it then re-signs with the real
        # distribution certificate.
        run: |
          set -euo pipefail
          # The product is named Bojang.app, so discover it like the verify
          # step does instead of hardcoding a name.
          app_path="$(find build/ios/archive/Runner.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$app_path" ] || [ ! -d "$app_path" ]; then
            echo "::error::No .app found in the archive at build/ios/archive/Runner.xcarchive/Products/Applications"
            exit 1
          fi
          if [ -d "$app_path/Frameworks" ]; then
            find "$app_path/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -print0 \
              | xargs -0 -n1 codesign --force --sign - --timestamp=none
          fi
          codesign --force --sign - --timestamp=none \
            --entitlements ios/Runner/Runner.entitlements "$app_path"

      - name: Export IPA
        id: export
        run: |
          set -euo pipefail
          export_options="build/ios/ExportOptionsCI.plist"
          cat > "$export_options" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

          mkdir -p build/ios/ipa
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist "$export_options" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.asc-key.outputs.path }}" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee build/ios/xcodebuild-export.log

          ipa_path="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$ipa_path"
          echo "ipa=$ipa_path" >> "$GITHUB_OUTPUT"

      - name: Verify IPA metadata and signature
        run: |
          set -euo pipefail
          verify_dir="$RUNNER_TEMP/verify-ipa"
          rm -rf "$verify_dir"
          mkdir -p "$verify_dir"
          unzip -q "${{ steps.export.outputs.ipa }}" -d "$verify_dir"
          app_path="$(find "$verify_dir/Payload" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          actual_bundle="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Info.plist")"
          actual_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Info.plist")"
          actual_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_path/Info.plist")"
          test "$actual_bundle" = "$IOS_BUNDLE_ID"
          test "$actual_version" = "${{ needs.prepare.outputs.marketing }}"
          test "$actual_build" = "${{ needs.prepare.outputs.build }}"

          # Apple will reject new uploads below iOS 15 starting in Spring 2027.
          # Validate both the Runner app and Flutter's embedded App.framework
          # so project/template drift cannot silently reintroduce ITMS-90068.
          verify_minimum_os() {
            plist="$1"
            label="$2"
            minimum="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$plist" 2>/dev/null || true)"
            major="${minimum%%.*}"
            if ! [[ "$major" =~ ^[0-9]+$ ]] || [ "$major" -lt 15 ]; then
              echo "::error::$label MinimumOSVersion must be 15.0 or later; found '${minimum:-missing}'."
              exit 1
            fi
            echo "$label MinimumOSVersion: $minimum"
          }
          verify_minimum_os "$app_path/Info.plist" "Runner.app"
          verify_minimum_os "$app_path/Frameworks/App.framework/Info.plist" "App.framework"

          codesign --verify --deep --strict "$app_path"

          # Firebase powers Google sign-in and account sync; a placeholder
          # plist means the restore step was skipped and auth would break.
          gs_plist="$app_path/GoogleService-Info.plist"
          if [ ! -f "$gs_plist" ]; then
            echo "::error::GoogleService-Info.plist missing from the app bundle; Firebase cannot initialize."
            exit 1
          fi
          bundled_project="$(/usr/libexec/PlistBuddy -c 'Print :PROJECT_ID' "$gs_plist")"
          if [ "$bundled_project" = "bojang-placeholder" ]; then
            echo "::error::App bundle contains the placeholder GoogleService-Info.plist; set the GOOGLE_SERVICE_INFO_PLIST secret."
            exit 1
          fi

      - name: Upload to TestFlight
        env:
          ASC_KEY_PATH: ${{ steps.asc-key.outputs.path }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build }}
        run: |
          set -euo pipefail

          # Re-running a run keeps the same build number, so check first
          # whether this build already made it to App Store Connect and treat
          # that as done rather than uploading a duplicate.
          token="$(ruby "$RUNNER_TEMP/asc_jwt.rb" "$ASC_KEY_ID" "$ASC_ISSUER_ID" "$ASC_KEY_PATH")"
          app_id="$(curl -sS --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $token" \
            "https://api.appstoreconnect.apple.com/v1/apps?filter%5BbundleId%5D=$IOS_BUNDLE_ID&limit=1" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin).get("data",[]); print(d[0]["id"] if d else "")' \
            || true)"
          if [ -n "$app_id" ]; then
            existing="$(curl -sS --retry 3 --retry-all-errors \
              -H "Authorization: Bearer $token" \
              "https://api.appstoreconnect.apple.com/v1/builds?filter%5Bapp%5D=$app_id&filter%5Bversion%5D=$BUILD_NUMBER&limit=1" \
              | python3 -c 'import json,sys; print(len(json.load(sys.stdin).get("data",[])))' \
              || echo 0)"
            if [ "${existing:-0}" != "0" ]; then
              echo "::notice::Build $BUILD_NUMBER is already on App Store Connect; skipping the upload."
              exit 0
            fi
          fi

          for attempt in 1 2 3; do
            out="$RUNNER_TEMP/altool-$attempt.log"
            if xcrun altool \
              --upload-app \
              --type ios \
              --file "${{ steps.export.outputs.ipa }}" \
              --apiKey "$ASC_KEY_ID" \
              --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$out"; then
              exit 0
            fi
            # App Store Connect can accept an upload and still time out the
            # client, and its build list lags behind by a minute or so.
            if grep -qiE 'already been uploaded|redundant binary|bundle version must be higher' "$out"; then
              echo "::notice::App Store Connect already has this binary; treating the upload as done."
              exit 0
            fi
            echo "::warning::TestFlight upload attempt $attempt failed; retrying."
            sleep $((attempt * 30))
          done
          echo "::error::TestFlight upload failed after 3 attempts."
          exit 1

      - name: Upload iOS artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bojang-ios-${{ needs.prepare.outputs.version }}
          path: build/ios/ipa/*.ipa
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload iOS build logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bojang-ios-logs-${{ needs.prepare.outputs.version }}
          path: build/ios/*.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Tag and publish release
    # Runs whenever at least one store accepted the build. Build numbers come
    # from the run counter and the version is already committed, so nothing
    # here can strand a number — this job only records what shipped.
    if: >-
      ${{
        always() &&
        needs.quality.result == 'success' &&
        (needs.android.result == 'success' || needs.ios.result == 'success')
      }}
    needs:
      - prepare
      - quality
      - android
      - ios
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: mobile-production
    permissions:
      contents: write
    steps:
      - name: Report store upload outcomes
        env:
          ANDROID_RESULT: ${{ needs.android.result }}
          IOS_RESULT: ${{ needs.ios.result }}
        run: |
          set -euo pipefail
          {
            echo "### Store uploads"
            echo "- Android: \`$ANDROID_RESULT\`"
            echo "- iOS: \`$IOS_RESULT\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ANDROID_RESULT" = "failure" ] || [ "$IOS_RESULT" = "failure" ]; then
            echo "::warning::One store upload failed. The other store shipped this build; the failed platform ships with the next release."
          fi

      - name: Check out the released commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.release_sha }}
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}

      - name: Push the release tag
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::notice::Tag $RELEASE_TAG already exists; leaving it as is."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Tag the commit that was built, which a later push may have moved past.
          git tag -a "$RELEASE_TAG" -m "Mobile release $RELEASE_VERSION" "$RELEASE_SHA"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
        continue-on-error: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Bojang ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/**/*.ipa
            artifacts/**/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        continue-on-error: true
